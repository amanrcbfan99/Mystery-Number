<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="fullpage">
        <div id="titles">
            <h1>MYSTERY NUMBER</h1>
        </div>
        <div id="instruction"><h4>Guess the Number Between 1 to 50...!</h4></div>
        <div id="input"> <input id="typehere" type="number" placeholder="Guess the number here"></div>
        <div id="attempts">
            <div id="attemptsremain">Attempts Remaining : 7</div>
        </div>
        <div id="hintsection">
            <div id="hint"> HINT : -</div>
        </div>
        <div id="btns">
            <button id="reset">Reset Game</button>
            <button id="submit">Submit</button>
        </div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
